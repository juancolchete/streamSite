services:
  streamsite:
    container_name: stream-site 
    build: .
    shm_size: '2gb'
    env_file:
      - .env
    restart: unless-stopped
  nginx-rtmp:
    image: tiangolo/nginx-rtmp:latest
    container_name: nginx-rtmp
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
